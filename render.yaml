services:
  - type: web
    name: studentlearn-api
    runtime: python
    repo: https://github.com/phimanh/studentlearn.git
    branch: main
    rootDir: backend
    pythonVersion: "3.11"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    plan: starter
    envVars:
      - key: PYTHONUTF8
        value: "1"
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: GRAPH_DATABASE_PROVIDER
        value: kuzu
      - key: GRAPH_PROVIDER
        value: cognee
      - key: SYSTEM_ROOT_DIRECTORY
        value: /var/data/.cognee_system
      - key: DATA_ROOT_DIRECTORY
        value: /var/data/.cognee_data
      - key: MAX_FILE_SIZE_MB
        value: "100"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        sync: false
      - key: NEO4J_URI
        value: bolt://localhost:7687
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false