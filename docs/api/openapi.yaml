openapi: 3.1.0
info:
  title: StudentLearn AI
  description: GraphRAG system for personalized learning with Cognee and Gemini
  version: 2.0.0
paths:
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: Register
      description: Register a new user
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      description: Login and get access token
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/documents/ingest:
    post:
      tags:
      - documents
      summary: Ingest Document
      description: Upload and ingest a document asynchronously to extract knowledge
        graph
      operationId: ingest_document_api_v1_documents_ingest_post
      security:
      - HTTPBearer: []
      parameters:
      - name: subject
        in: query
        required: false
        schema:
          type: string
          default: general
          title: Subject
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_ingest_document_api_v1_documents_ingest_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIngestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/documents/status/{task_id}:
    get:
      tags:
      - documents
      summary: Get Ingest Status
      description: Check the status of a background ingestion task
      operationId: get_ingest_status_api_v1_documents_status__task_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/documents/tasks/{task_id}:
    get:
      tags:
      - documents
      summary: Get Task Detail
      description: 'Get detailed task information including step-by-step progress
        log.

        Used by UI for real-time progress bar updates.'
      operationId: get_task_detail_api_v1_documents_tasks__task_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/documents/:
    get:
      tags:
      - documents
      summary: List Documents
      description: List all documents for current user
      operationId: list_documents_api_v1_documents__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DocumentResponse'
                type: array
                title: Response List Documents Api V1 Documents  Get
      security:
      - HTTPBearer: []
  /api/v1/documents/{doc_id}/topics:
    get:
      tags:
      - documents
      summary: Get Document Topics
      description: Get all topics extracted from a document
      operationId: get_document_topics_api_v1_documents__doc_id__topics_get
      security:
      - HTTPBearer: []
      parameters:
      - name: doc_id
        in: path
        required: true
        schema:
          type: string
          title: Doc Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopicResponse'
                title: Response Get Document Topics Api V1 Documents  Doc Id  Topics
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/quiz/{topic_id}:
    get:
      tags:
      - quiz
      summary: Get Quiz
      description: Generate or get cached quiz for a topic
      operationId: get_quiz_api_v1_quiz__topic_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: topic_id
        in: path
        required: true
        schema:
          type: string
          title: Topic Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/quiz/submit:
    post:
      tags:
      - quiz
      summary: Submit Quiz
      description: Submit quiz answers and get evaluation
      operationId: submit_quiz_api_v1_quiz_submit_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSubmitRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSubmitResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/learning-path/{user_id}:
    get:
      tags:
      - learning_path
      summary: Get Learning Path
      description: Get personalized learning path for user (cached if available)
      operationId: get_learning_path_api_v1_learning_path__user_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      - name: goal
        in: query
        required: false
        schema:
          type: string
          description: Learning goal
          default: master_all
          title: Goal
        description: Learning goal
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningPathResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/learning-path/generate:
    post:
      tags:
      - learning_path
      summary: Regenerate Learning Path
      description: Force regenerate learning path
      operationId: regenerate_learning_path_api_v1_learning_path_generate_post
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: query
        required: true
        schema:
          type: string
          title: User Id
      - name: goal
        in: query
        required: false
        schema:
          type: string
          default: master_all
          title: Goal
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningPathResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/progress/{user_id}:
    get:
      tags:
      - progress
      summary: Get Progress
      description: Get all topic progress for user
      operationId: get_progress_api_v1_progress__user_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProgressResponse'
                title: Response Get Progress Api V1 Progress  User Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/progress/{user_id}/{topic_id}:
    put:
      tags:
      - progress
      summary: Update Progress
      description: Update self-rating for a topic
      operationId: update_progress_api_v1_progress__user_id___topic_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      - name: topic_id
        in: path
        required: true
        schema:
          type: string
          title: Topic Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/graph-rag/query:
    post:
      tags:
      - GraphRAG
      summary: Query Graph Rag
      description: Query the knowledge graph using GraphRAG (Neo4j + Gemini) with
        Web Search fallback.
      operationId: query_graph_rag_api_v1_graph_rag_query_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/graph-rag/visualize/{document_id}:
    get:
      tags:
      - GraphRAG
      summary: Visualize Document Graph
      description: 'Return nodes and edges for a document''s knowledge graph for visualization.

        Nodes include skill_level for color coding (0=Gray, 1=Red, 2=Gold, 3=Green).'
      operationId: visualize_document_graph_api_v1_graph_rag_visualize__document_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphVisualizationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/health:
    get:
      summary: Health
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/health/diagnostic:
    get:
      summary: Diagnostic
      operationId: diagnostic_api_v1_health_diagnostic_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticResponse'
      security:
      - HTTPBearer: []
  /:
    get:
      summary: Root
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    Body_ingest_document_api_v1_documents_ingest_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_ingest_document_api_v1_documents_ingest_post
    DiagnosticCheck:
      properties:
        name:
          type: string
          title: Name
        status:
          type: boolean
          title: Status
        message:
          type: string
          title: Message
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
      type: object
      required:
      - name
      - status
      - message
      title: DiagnosticCheck
    DiagnosticResponse:
      properties:
        overall_status:
          type: string
          title: Overall Status
        checks:
          items:
            $ref: '#/components/schemas/DiagnosticCheck'
          type: array
          title: Checks
      type: object
      required:
      - overall_status
      - checks
      title: DiagnosticResponse
    DocumentIngestResponse:
      properties:
        doc_id:
          type: string
          title: Doc Id
        filename:
          type: string
          title: Filename
        task_id:
          type: string
          title: Task Id
        status:
          type: string
          title: Status
      type: object
      required:
      - doc_id
      - filename
      - task_id
      - status
      title: DocumentIngestResponse
    DocumentResponse:
      properties:
        id:
          type: string
          title: Id
        filename:
          type: string
          title: Filename
        uploaded_at:
          type: string
          format: date-time
          title: Uploaded At
      type: object
      required:
      - id
      - filename
      - uploaded_at
      title: DocumentResponse
    GraphLink:
      properties:
        source:
          type: string
          title: Source
        target:
          type: string
          title: Target
        type:
          type: string
          title: Type
          default: relatedTo
      type: object
      required:
      - source
      - target
      title: GraphLink
    GraphNode:
      properties:
        id:
          type: string
          title: Id
        label:
          type: string
          title: Label
        skill_level:
          type: integer
          title: Skill Level
          default: 1
        type:
          type: string
          title: Type
          default: concept
      type: object
      required:
      - id
      - label
      title: GraphNode
    GraphVisualizationResponse:
      properties:
        nodes:
          items:
            $ref: '#/components/schemas/GraphNode'
          type: array
          title: Nodes
        links:
          items:
            $ref: '#/components/schemas/GraphLink'
          type: array
          title: Links
      type: object
      required:
      - nodes
      - links
      title: GraphVisualizationResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LearningPathItem:
      properties:
        topic_id:
          type: string
          title: Topic Id
        name:
          type: string
          title: Name
        priority:
          type: integer
          title: Priority
        reason:
          type: string
          title: Reason
        estimated_time:
          type: string
          title: Estimated Time
        status:
          type: string
          title: Status
      type: object
      required:
      - topic_id
      - name
      - priority
      - reason
      - estimated_time
      - status
      title: LearningPathItem
    LearningPathResponse:
      properties:
        path:
          items:
            $ref: '#/components/schemas/LearningPathItem'
          type: array
          title: Path
        summary:
          anyOf:
          - type: string
          - type: 'null'
          title: Summary
      type: object
      required:
      - path
      title: LearningPathResponse
    ProgressResponse:
      properties:
        topic_id:
          type: string
          title: Topic Id
        topic_name:
          type: string
          title: Topic Name
        skill_level:
          type: integer
          title: Skill Level
        last_attempt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Attempt
      type: object
      required:
      - topic_id
      - topic_name
      - skill_level
      title: ProgressResponse
    ProgressUpdate:
      properties:
        skill_level:
          type: integer
          maximum: 3.0
          minimum: 0.0
          title: Skill Level
      type: object
      required:
      - skill_level
      title: ProgressUpdate
    QueryRequest:
      properties:
        query:
          type: string
          title: Query
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
          default: default-session
      type: object
      required:
      - query
      title: QueryRequest
    QueryResponse:
      properties:
        answer:
          type: string
          title: Answer
      type: object
      required:
      - answer
      title: QueryResponse
    QuizQuestion:
      properties:
        id:
          type: string
          title: Id
        text:
          type: string
          title: Text
        type:
          type: string
          title: Type
          default: multiple_choice
        options:
          items:
            type: string
          type: array
          title: Options
          default: []
        explanation:
          anyOf:
          - type: string
          - type: 'null'
          title: Explanation
        cognitive_level:
          type: string
          title: Cognitive Level
          default: application
      type: object
      required:
      - id
      - text
      title: QuizQuestion
    QuizResponse:
      properties:
        quiz_id:
          type: string
          title: Quiz Id
        topic_id:
          type: string
          title: Topic Id
        questions:
          items:
            $ref: '#/components/schemas/QuizQuestion'
          type: array
          title: Questions
      type: object
      required:
      - quiz_id
      - topic_id
      - questions
      title: QuizResponse
    QuizResultDetail:
      properties:
        question_id:
          type: string
          title: Question Id
        question_text:
          type: string
          title: Question Text
        user_answer:
          type: string
          title: User Answer
        correct_answer:
          type: string
          title: Correct Answer
        is_correct:
          type: boolean
          title: Is Correct
        explanation:
          anyOf:
          - type: string
          - type: 'null'
          title: Explanation
      type: object
      required:
      - question_id
      - question_text
      - user_answer
      - correct_answer
      - is_correct
      title: QuizResultDetail
    QuizSubmitAnswer:
      properties:
        question_id:
          type: string
          title: Question Id
        answer:
          type: string
          title: Answer
      type: object
      required:
      - question_id
      - answer
      title: QuizSubmitAnswer
    QuizSubmitRequest:
      properties:
        quiz_id:
          type: string
          title: Quiz Id
        answers:
          items:
            $ref: '#/components/schemas/QuizSubmitAnswer'
          type: array
          title: Answers
      type: object
      required:
      - quiz_id
      - answers
      title: QuizSubmitRequest
    QuizSubmitResponse:
      properties:
        quiz_id:
          type: string
          title: Quiz Id
        topic_id:
          type: string
          title: Topic Id
        correct_count:
          type: integer
          title: Correct Count
        total:
          type: integer
          title: Total
        score:
          type: string
          title: Score
        skill_level:
          type: integer
          title: Skill Level
        feedback:
          type: string
          title: Feedback
        results:
          items:
            $ref: '#/components/schemas/QuizResultDetail'
          type: array
          title: Results
      type: object
      required:
      - quiz_id
      - topic_id
      - correct_count
      - total
      - score
      - skill_level
      - feedback
      - results
      title: QuizSubmitResponse
    TaskStatusResponse:
      properties:
        task_id:
          type: string
          title: Task Id
        status:
          type: string
          title: Status
        progress:
          type: integer
          title: Progress
        message:
          type: string
          title: Message
        created_at:
          type: string
          title: Created At
        completed_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Completed At
        error:
          anyOf:
          - type: string
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Error
      type: object
      required:
      - task_id
      - status
      - progress
      - message
      - created_at
      title: TaskStatusResponse
    Token:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
          default: bearer
      type: object
      required:
      - access_token
      title: Token
    TopicResponse:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        type:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
        difficulty:
          anyOf:
          - type: string
          - type: 'null'
          title: Difficulty
        subject:
          anyOf:
          - type: string
          - type: 'null'
          title: Subject
      type: object
      required:
      - id
      - name
      title: TopicResponse
    UserLogin:
      properties:
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          title: Password
      type: object
      required:
      - email
      - password
      title: UserLogin
    UserRegister:
      properties:
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          minLength: 6
          title: Password
        name:
          type: string
          minLength: 1
          title: Name
      type: object
      required:
      - email
      - password
      - name
      title: UserRegister
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
